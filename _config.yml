title: My Blog
author: Decadenza-kle
description: >-
  Notes, ideas and things I'm working on.
url: "https://decadenza-kle.github.io"
baseurl: ""

permalink: /:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge

plugins:
