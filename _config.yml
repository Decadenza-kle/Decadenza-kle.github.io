title: Decadenza
tagline: "Personal blog. Research, personal art and critiques."
author: Decadenza-kle
description: >-
  Personal blog. Research, personal art and critiques.
url: "https://decadenza-kle.github.io"
baseurl: ""
lang: en

permalink: /:categories/:title/
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

plugins:
  - jekyll-seo-tag

links:
  github: https://github.com/Decadenza-kle

defaults:
  - scope: { type: posts }
    values: { layout: post }

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

# Observer position for the live sky map on the About page.
sky:
  lat: 50.67
  lon: 4.61
