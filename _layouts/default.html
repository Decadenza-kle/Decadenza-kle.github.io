<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  {% include head.html %}
  <body id="top" class="{% if page.layout == 'home' %}is-home{% else %}is-inner{% endif %}">
    <canvas id="bg" class="bg" aria-hidden="true"></canvas>
    <a class="skip mono" href="#main">Skip to content</a>
    {% unless page.layout == 'home' %}{% include topbar.html %}{% endunless %}
    <main id="main">
      {{ content }}
    </main>
    {% unless page.layout == 'home' %}{% include footer.html %}{% endunless %}
  </body>
</html>
